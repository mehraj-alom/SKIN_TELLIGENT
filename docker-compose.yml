version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=*
    volumes:
      - ./models:/app/models
      - ./output:/app/output

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/detect
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./output:/app/output
